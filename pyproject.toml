[project]
name = "haven"
version = "0.1.0"
description = "Verktyg for Swish-kollekt och gavoavstamning, Harnosands pastorat"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "jinja2>=3.1",
    "python-multipart>=0.0.12",
    "openpyxl>=3.1",
    "xlrd==2.0.1",
    "sqlalchemy>=2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
